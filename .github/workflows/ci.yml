name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android + tests KMP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests KMP (cible Android) et tests unitaires Android
        run: ./gradlew testDebugUnitTest --continue
      - name: Build de l'app Android
        run: ./gradlew :androidApp:assembleDebug

  ios:
    name: iOS + tests KMP
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests KMP (simulateur iOS)
        run: ./gradlew iosSimulatorArm64Test --continue
      - name: XCFramework KMP pour les packages SPM
        run: scripts/build-ios-framework.sh debug
      - name: Génération du projet Xcode
        run: |
          brew install xcodegen
          cd iosApp && xcodegen
      - name: Build de l'app iOS et des démos de features (simulateur, sans signature)
        run: |
          cd iosApp
          for scheme in iosApp TodoDemo; do
            xcodebuild build \
              -project iosApp.xcodeproj \
              -scheme "$scheme" \
              -configuration Debug \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO
          done
