name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android + tests KMP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests KMP (cible Android) et tests unitaires Android
        run: ./gradlew testDebugUnitTest --continue
      - name: Build de l'app Android
        run: ./gradlew :androidApp:assembleDebug
      - name: Taille de l'APK debug (suivi du poids, ADR 0010)
        run: ls -l androidApp/build/outputs/apk/debug/*.apk

  ios:
    name: iOS + tests KMP
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # CoreLocation (core:location) lie le framework _LocationEssentials, absent des SDK antérieurs à Xcode 26 :
      # on prend le Xcode stable le plus récent de l'image (Youssef développe sous Xcode 26).
      - name: Xcode stable le plus récent
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests KMP (simulateur iOS)
        run: ./gradlew iosSimulatorArm64Test --continue
      - name: XCFramework KMP pour les packages SPM
        run: scripts/build-ios-framework.sh debug
      - name: Génération du projet Xcode
        run: |
          brew install xcodegen
          cd iosApp && xcodegen
      - name: Build de l'app iOS et des démos de features (simulateur, sans signature)
        run: |
          cd iosApp
          for scheme in iosApp TodoDemo WeatherDemo SettingsDemo AuthDemo CatalogDemo TodoComposeDemo; do
            xcodebuild build \
              -project iosApp.xcodeproj \
              -scheme "$scheme" \
              -configuration Debug \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO
          done
      - name: Textes de permission de localisation dans l'Info.plist de l'app
        run: |
          plist=$(find ~/Library/Developer/Xcode/DerivedData -path '*/Debug-iphonesimulator/iosApp.app/Info.plist' | head -1)
          /usr/libexec/PlistBuddy -c 'Print :NSLocationWhenInUseUsageDescription' "$plist"
          /usr/libexec/PlistBuddy -c 'Print :NSLocationDefaultAccuracyReduced' "$plist"
      - name: Clé exigée par Compose Multiplatform dans l'Info.plist des apps qui l'affichent
        run: |
          for app in iosApp TodoComposeDemo; do
            plist=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Debug-iphonesimulator/$app.app/Info.plist" | head -1)
            /usr/libexec/PlistBuddy -c 'Print :CADisableMinimumFrameDurationOnPhone' "$plist"
          done
      - name: Taille du framework Kotlin et de l'app iOS (suivi du poids, ADR 0010)
        run: |
          app=$(find ~/Library/Developer/Xcode/DerivedData -path '*/Debug-iphonesimulator/iosApp.app' -type d | head -1)
          du -sh "$app" "$app/Frameworks/Shared.framework"
          # Binaire release pour iPhone (arm64) : la taille qui compte pour l'utilisateur.
          ./gradlew :shared:linkReleaseFrameworkIosArm64
          ls -l shared/build/bin/iosArm64/releaseFramework/Shared.framework/Shared
