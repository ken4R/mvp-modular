name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android + tests KMP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests KMP (cible Android) et tests unitaires Android
        run: ./gradlew testDebugUnitTest --continue
      - name: Build de l'app Android
        run: ./gradlew :androidApp:assembleDebug
      - name: Taille de l'APK debug (suivi du poids, ADR 0010)
        run: ls -l androidApp/build/outputs/apk/debug/*.apk
      - name: Build release minifié par R8
        run: ./gradlew :androidApp:assembleRelease
      - name: Faux service de connexion et features en développement absents du build release
        run: |
          debug=$(ls androidApp/build/outputs/apk/debug/*.apk | head -1)
          release=$(ls androidApp/build/outputs/apk/release/*.apk | head -1)
          ls -l "$release"
          unzip -p "$debug" 'classes*.dex' > "$RUNNER_TEMP/debug.dex"
          unzip -p "$release" 'classes*.dex' > "$RUNNER_TEMP/release.dex"
          # Témoin : le faux service et son mot de passe sont bien visibles dans le code du build debug.
          grep -aq FakeAuthRemoteDataSource "$RUNNER_TEMP/debug.dex"
          grep -aq demo1234 "$RUNNER_TEMP/debug.dex"
          if grep -aq demo1234 "$RUNNER_TEMP/release.dex"; then
            echo "error: le build release contient encore le faux service de connexion" >&2
            exit 1
          fi
          # Feature en développement (flag preview_banner, ADR 0021) : son texte n'existe que dans le build debug.
          grep -aq "nouvelle fonction en pr" "$RUNNER_TEMP/debug.dex"
          if grep -aq "nouvelle fonction en pr" "$RUNNER_TEMP/release.dex"; then
            echo "error: le build release contient une feature en développement (preview_banner)" >&2
            exit 1
          fi

  ios:
    name: iOS + tests KMP
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # CoreLocation (core:location) lie le framework _LocationEssentials, absent des SDK antérieurs à Xcode 26 :
      # on prend le Xcode stable le plus récent de l'image (Youssef développe sous Xcode 26).
      - name: Xcode stable le plus récent
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Compilateur Kotlin/Native et caches des bibliothèques (stdlib, coroutines, Koin, Ktor, Compose, Skia...) :
      # sans eux, chaque run retélécharge le compilateur et recompile les caches avant la première liaison.
      # Une clé par job : un cache déjà présent n'est jamais réécrit, celui du job release n'a pas les caches debug.
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-sim-debug-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-sim-debug-${{ runner.os }}-${{ runner.arch }}-
      - name: Tests KMP (simulateur iOS)
        run: ./gradlew iosSimulatorArm64Test --continue
      # Une seule tranche (simulateur arm64, celle du runner) au lieu des trois : la liaison Kotlin/Native est
      # l'étape la plus longue. Les builds Xcode ci-dessous (ARCHS=arm64) la retrouvent à jour.
      - name: XCFramework KMP pour les packages SPM (simulateur arm64)
        run: scripts/build-ios-framework.sh debug iosSimulatorArm64
      - name: Génération du projet Xcode
        run: |
          brew install xcodegen
          cd iosApp && xcodegen
      - name: Build de l'app iOS et des démos de features (simulateur, sans signature)
        run: |
          cd iosApp
          for scheme in iosApp TodoDemo WeatherDemo SettingsDemo AuthDemo CatalogDemo TodoComposeDemo OnboardingDemo; do
            xcodebuild build \
              -project iosApp.xcodeproj \
              -scheme "$scheme" \
              -configuration Debug \
              -destination 'generic/platform=iOS Simulator' \
              ARCHS=arm64 \
              CODE_SIGNING_ALLOWED=NO
          done
      - name: Textes de permission de localisation dans l'Info.plist de l'app
        run: |
          plist=$(find ~/Library/Developer/Xcode/DerivedData -path '*/Debug-iphonesimulator/iosApp.app/Info.plist' | head -1)
          /usr/libexec/PlistBuddy -c 'Print :NSLocationWhenInUseUsageDescription' "$plist"
          /usr/libexec/PlistBuddy -c 'Print :NSLocationDefaultAccuracyReduced' "$plist"
          # Rappels par lieu (ADR 0023) : la démo Tâches demande aussi la position.
          plist=$(find ~/Library/Developer/Xcode/DerivedData -path '*/Debug-iphonesimulator/TodoDemo.app/Info.plist' | head -1)
          /usr/libexec/PlistBuddy -c 'Print :NSLocationWhenInUseUsageDescription' "$plist"
      - name: Texte de permission du calendrier (iOS 16, ADR 0022) dans l'Info.plist des apps qui exportent une tâche
        run: |
          for app in iosApp TodoDemo; do
            plist=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Debug-iphonesimulator/$app.app/Info.plist" | head -1)
            /usr/libexec/PlistBuddy -c 'Print :NSCalendarsUsageDescription' "$plist"
          done
      - name: Extension du widget Tâches embarquée dans l'app, sans le framework Kotlin (ADR 0011)
        run: |
          app=$(find ~/Library/Developer/Xcode/DerivedData -path '*/Debug-iphonesimulator/iosApp.app' -type d | head -1)
          appex="$app/PlugIns/TodoWidgetExtension.appex"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$appex/Info.plist"
          if otool -L "$appex/TodoWidgetExtension" | grep -q Shared.framework; then
            echo "error: l'extension widget ne doit pas lier Shared.framework" >&2
            exit 1
          fi
      - name: Clé exigée par Compose Multiplatform dans l'Info.plist des apps qui l'affichent
        run: |
          for app in iosApp TodoComposeDemo; do
            plist=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Debug-iphonesimulator/$app.app/Info.plist" | head -1)
            /usr/libexec/PlistBuddy -c 'Print :CADisableMinimumFrameDurationOnPhone' "$plist"
          done
      - name: Taille de l'app iOS (suivi du poids, ADR 0010)
        run: |
          app=$(find ~/Library/Developer/Xcode/DerivedData -path '*/Debug-iphonesimulator/iosApp.app' -type d | head -1)
          du -sk "$app" "$app/Frameworks/Shared.framework"

  # Liaison release du framework (optimisations complètes, une dizaine de minutes) dans un job à part, en parallèle
  # du job iOS : elle ne sert qu'au suivi du poids.
  ios-release-size:
    name: Taille du framework Kotlin release (iPhone)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode stable le plus récent
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-release-${{ runner.os }}-${{ runner.arch }}-
      - name: Taille du framework Kotlin release (suivi du poids, ADR 0010)
        run: |
          # Binaire release pour iPhone (arm64) : la taille qui compte pour l'utilisateur.
          ./gradlew :shared:linkReleaseFrameworkIosArm64
          ls -l shared/build/bin/iosArm64/releaseFramework/Shared.framework/Shared
