# Projet Xcode généré avec XcodeGen.
# Premier lancement : `scripts/build-ios-framework.sh && cd iosApp && xcodegen && open iosApp.xcodeproj`
#
# Chaque feature iOS est un package SPM dans Packages/ ; sa démo éventuelle (Packages/<Feature>/Demo)
# est une app déclarée ici, qui ne lance que cette feature.
name: iosApp
options:
  bundleIdPrefix: com.mvp
  # App en français : Siri lit les phrases des raccourcis (AddTodoIntent.swift, ADR 0018) dans cette langue.
  developmentLanguage: fr
  deploymentTarget:
    iOS: "16.0"

packages:
  SharedKMP:
    path: Packages/SharedKMP
  DesignSystemUI:
    path: Packages/DesignSystemUI
  FeatureTodo:
    path: Packages/FeatureTodo
  FeatureWeather:
    path: Packages/FeatureWeather
  FeatureSettings:
    path: Packages/FeatureSettings
  FeatureAuth:
    path: Packages/FeatureAuth
  FeatureCatalog:
    path: Packages/FeatureCatalog
  FeatureTodoCompose:
    path: Packages/FeatureTodoCompose
  FeatureTodoWidget:
    path: Packages/FeatureTodoWidget
  FeatureOnboarding:
    path: Packages/FeatureOnboarding
  FeatureFocus:
    path: Packages/FeatureFocus

settingGroups:
  # Versions communes à l'app et à son extension widget (iOS refuse une extension de version différente).
  versions:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  # Avec `groups`, XcodeGen ne lit que `base` / `configs` : les réglages vont sous `base`.
  app:
    groups: [versions]
    base:
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES

aggregateTargets:
  # Recompile le XCFramework Kotlin avant chaque build de l'app complète (module Gradle shared).
  KotlinShared:
    buildScripts: &kotlinBuildScripts
      - name: Compile Kotlin (Shared.xcframework)
        basedOnDependencyAnalysis: false
        # Toute configuration autre que Debug (archive TestFlight / App Store) : framework Kotlin release,
        # où le faux service de connexion est désactivé.
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then config=debug; else config=release; fi
          # Sans cible : le script ne lie que les tranches du build en cours (PLATFORM_NAME, ARCHS).
          "$SRCROOT/../scripts/build-ios-framework.sh" "$config"
    settings:
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      # Construite pour la destination choisie (iPhone ou simulateur) : PLATFORM_NAME et ARCHS sont ceux de l'app.
      SDKROOT: iphoneos
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      KMP_MODULE: shared

  # Une cible par app de démo : même script, avec le parapluie de la démo (umbrella/<nom>-demo, ADR 0027), un
  # framework « Shared » réduit à sa feature. Il remplace celui de l'app complète dans Packages/SharedKMP ; passer
  # d'une démo à l'autre (ou à l'app) relie donc le framework de la cible lancée.
  KotlinTodoDemo:
    buildScripts: *kotlinBuildScripts
    settings:
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      SDKROOT: iphoneos
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      KMP_MODULE: umbrella:todo-demo
  KotlinWeatherDemo:
    buildScripts: *kotlinBuildScripts
    settings:
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      SDKROOT: iphoneos
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      KMP_MODULE: umbrella:weather-demo
  KotlinSettingsDemo:
    buildScripts: *kotlinBuildScripts
    settings:
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      SDKROOT: iphoneos
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      KMP_MODULE: umbrella:settings-demo
  KotlinAuthDemo:
    buildScripts: *kotlinBuildScripts
    settings:
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      SDKROOT: iphoneos
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      KMP_MODULE: umbrella:auth-demo
  KotlinCatalogDemo:
    buildScripts: *kotlinBuildScripts
    settings:
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      SDKROOT: iphoneos
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      KMP_MODULE: umbrella:catalog-demo
  KotlinTodoComposeDemo:
    buildScripts: *kotlinBuildScripts
    settings:
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      SDKROOT: iphoneos
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      KMP_MODULE: umbrella:todo-compose-demo
  KotlinOnboardingDemo:
    buildScripts: *kotlinBuildScripts
    settings:
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      SDKROOT: iphoneos
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      KMP_MODULE: umbrella:onboarding-demo

targets:
  # App complète : assemble toutes les features.
  iosApp:
    type: application
    # Avant le build (ADR 0027) : met en place le framework Kotlin de cette app dans Packages/SharedKMP. Xcode
    # compile les packages Swift en parallèle de la cible KotlinShared : sans ce pré-build, ils verraient le framework
    # de la dernière app construite. Xcode ignore l'échec d'un pré-build : la cible Kotlin, qui relance le même
    # script (rien à refaire s'il est à jour), fait échouer le build si la compilation Kotlin échoue.
    scheme:
      preActions:
        - name: Framework Kotlin de l'app
          settingsTarget: iosApp
          script: |
            if [ "$CONFIGURATION" = "Debug" ]; then config=debug; else config=release; fi
            # Journal : Xcode n'affiche pas la sortie d'un pré-build.
            {
              echo "PLATFORM_NAME=${PLATFORM_NAME:-} ARCHS=${ARCHS:-}"
              KMP_SWITCH_ONLY=1 KMP_MODULE=shared "$SRCROOT/../scripts/build-ios-framework.sh" "$config"
            } > "$SRCROOT/Generated/kotlin-prebuild.log" 2>&1
    platform: iOS
    sources: [iosApp]
    # Clés sans équivalent INFOPLIST_KEY_ : XcodeGen écrit ce plist, Xcode le fusionne avec l'Info.plist généré.
    # NSLocationDefaultAccuracyReduced propose la position approximative par défaut (équivalent d'ACCESS_COARSE_LOCATION).
    info:
      path: Generated/iosApp-Info.plist
      properties:
        NSLocationDefaultAccuracyReduced: true
        # Liens profonds mvpmodular://… (format dans core:deeplink, ADR 0008). Pas encore de liens universels :
        # il faudrait un domaine qui serve apple-app-site-association.
        CFBundleURLTypes:
          - CFBundleURLName: com.mvp.ios.deeplink
            CFBundleURLSchemes: [mvpmodular]
        # Exigé par Compose Multiplatform (écran Tâches partagé, ADR 0010) : autorise le 120 Hz (ProMotion),
        # sinon ComposeUIViewController s'arrête au lancement de l'écran.
        CADisableMinimumFrameDurationOnPhone: true
        # Live Activity du mode focus (ADR 0028), affichée par l'extension des widgets.
        NSSupportsLiveActivities: true
    # App Group partagé avec l'extension du widget Tâches : seul le fichier du widget y est écrit (ADR 0011).
    entitlements:
      path: Generated/iosApp.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mvp.ios]
    settings:
      groups: [app]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mvp.ios
        # ActivityKit (Live Activity du mode focus, ADR 0028) n'existe qu'à partir d'iOS 16.1 : lien faible pour que
        # l'app démarre encore sous iOS 16.0.
        OTHER_LDFLAGS: ["$(inherited)", "-weak_framework", "ActivityKit"]
        # Nom sous l'icône, et nom que Siri attend dans « Ajoute une tâche dans MVP Modular » (ADR 0018).
        INFOPLIST_KEY_CFBundleDisplayName: MVP Modular
        # iOS 16 seulement : l'écran d'ajout d'événement exige l'accès au calendrier ; depuis iOS 17 il n'en demande aucun (ADR 0022).
        INFOPLIST_KEY_NSCalendarsUsageDescription: "Sur iOS 16, l'accès au calendrier est nécessaire pour y ajouter une tâche. L'app ne lit pas vos événements."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID protège l'accès à l'app si vous activez le déverrouillage."
        # Météo (ADR 0005) et rappels par lieu (ADR 0023) : « Lorsque l'app est active » suffit aux deux.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Météo : votre position approximative (environ 1 km) est envoyée à Open-Meteo pour afficher la météo là où vous êtes. La dernière est gardée sur cet iPhone pour le widget Météo : s'il est posé, elle repart pour l'actualiser quand vous ouvrez l'app. Elle est effacée à la déconnexion ou si vous retirez l'accès à la position. Rappels par lieu : la position exacte du lieu choisi reste sur cet iPhone et n'est envoyée nulle part."
    dependencies:
      - target: KotlinShared
      - package: SharedKMP
        product: Shared
      - package: FeatureTodo
      - package: FeatureWeather
      - package: FeatureSettings
      - package: FeatureAuth
      - package: FeatureCatalog
      - package: FeatureTodoCompose
      - package: FeatureOnboarding
      - package: FeatureTodoWidget
        product: FeatureTodoWidget
      - package: FeatureFocus
        product: FeatureFocus
      # Widget Tâches, embarqué dans l'app (PlugIns/).
      - target: TodoWidgetExtension

  # Extension WidgetKit des widgets Tâches (ADR 0011, cases à cocher ADR 0026) et Météo (ADR 0026), et de la Live
  # Activity du mode focus (ADR 0028). Elle ne lie pas le framework Kotlin : elle ne lit que les fichiers écrits par
  # l'app dans l'App Group (produits TodoWidgetData et WeatherWidgetData) et l'état ActivityKit (FocusActivityData).
  # Les vues viennent du dossier Widget/ de chaque package.
  # Pas d'app de démo : un widget s'essaie depuis l'écran d'accueil, avec l'app complète.
  TodoWidgetExtension:
    type: app-extension
    platform: iOS
    sources: [WidgetExtension, Packages/FeatureTodoWidget/Widget, Packages/FeatureWeather/Widget, Packages/FeatureFocus/Widget]
    info:
      path: Generated/TodoWidgetExtension-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/TodoWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mvp.ios]
    settings:
      groups: [versions]
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mvp.ios.todowidget
        # Live Activity du mode focus : ActivityKit en lien faible (iOS 16.0, voir iosApp).
        OTHER_LDFLAGS: ["$(inherited)", "-weak_framework", "ActivityKit"]
        INFOPLIST_KEY_CFBundleDisplayName: Widgets
        SKIP_INSTALL: YES
    dependencies:
      - package: FeatureTodoWidget
        product: TodoWidgetData
      - package: FeatureWeather
        product: WeatherWidgetData
      - package: FeatureFocus
        product: FocusActivityData

  # Démo de la feature todo, lancée seule avec des données d'exemple.
  TodoDemo:
    type: application
    # Avant le build : son parapluie dans Packages/SharedKMP (voir iosApp).
    scheme:
      preActions:
        - name: Framework Kotlin de l'app
          settingsTarget: TodoDemo
          script: |
            if [ "$CONFIGURATION" = "Debug" ]; then config=debug; else config=release; fi
            # Journal : Xcode n'affiche pas la sortie d'un pré-build.
            {
              echo "PLATFORM_NAME=${PLATFORM_NAME:-} ARCHS=${ARCHS:-}"
              KMP_SWITCH_ONLY=1 KMP_MODULE=umbrella:todo-demo "$SRCROOT/../scripts/build-ios-framework.sh" "$config"
            } > "$SRCROOT/Generated/kotlin-prebuild.log" 2>&1
    platform: iOS
    sources: [Packages/FeatureTodo/Demo]
    settings:
      groups: [app]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mvp.ios.demo.todo
        INFOPLIST_KEY_CFBundleDisplayName: Todo Demo
        # iOS 16 seulement : l'écran d'ajout d'événement exige l'accès au calendrier ; depuis iOS 17 il n'en demande aucun (ADR 0022).
        INFOPLIST_KEY_NSCalendarsUsageDescription: "Sur iOS 16, l'accès au calendrier est nécessaire pour y ajouter une tâche. L'app ne lit pas vos événements."
        # Rappels par lieu (ADR 0023) : la fiche d'une tâche demande la position.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Rappels par lieu : la position exacte du lieu choisi reste sur cet iPhone et n'est envoyée nulle part."
    dependencies:
      - target: KotlinTodoDemo
      - package: SharedKMP
        product: Shared
      - package: FeatureTodo

  # Démo de la feature météo, ouverte sur une recherche d'exemple.
  WeatherDemo:
    type: application
    # Avant le build : son parapluie dans Packages/SharedKMP (voir iosApp).
    scheme:
      preActions:
        - name: Framework Kotlin de l'app
          settingsTarget: WeatherDemo
          script: |
            if [ "$CONFIGURATION" = "Debug" ]; then config=debug; else config=release; fi
            # Journal : Xcode n'affiche pas la sortie d'un pré-build.
            {
              echo "PLATFORM_NAME=${PLATFORM_NAME:-} ARCHS=${ARCHS:-}"
              KMP_SWITCH_ONLY=1 KMP_MODULE=umbrella:weather-demo "$SRCROOT/../scripts/build-ios-framework.sh" "$config"
            } > "$SRCROOT/Generated/kotlin-prebuild.log" 2>&1
    platform: iOS
    sources: [Packages/FeatureWeather/Demo]
    # Clés sans équivalent INFOPLIST_KEY_ : XcodeGen écrit ce plist, Xcode le fusionne avec l'Info.plist généré.
    # NSLocationDefaultAccuracyReduced propose la position approximative par défaut (équivalent d'ACCESS_COARSE_LOCATION).
    info:
      path: Generated/WeatherDemo-Info.plist
      properties:
        NSLocationDefaultAccuracyReduced: true
    settings:
      groups: [app]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mvp.ios.demo.weather
        INFOPLIST_KEY_CFBundleDisplayName: Weather Demo
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Votre position approximative (environ 1 km) est envoyée au service météo Open-Meteo pour afficher la météo là où vous êtes. La dernière est gardée sur cet iPhone pour le widget Météo, et effacée si vous retirez l'accès à la position."
    dependencies:
      - target: KotlinWeatherDemo
      - package: SharedKMP
        product: Shared
      - package: FeatureWeather

  # Démo de la feature réglages (profil, notifications, verrou Face ID, consentements).
  SettingsDemo:
    type: application
    # Avant le build : son parapluie dans Packages/SharedKMP (voir iosApp).
    scheme:
      preActions:
        - name: Framework Kotlin de l'app
          settingsTarget: SettingsDemo
          script: |
            if [ "$CONFIGURATION" = "Debug" ]; then config=debug; else config=release; fi
            # Journal : Xcode n'affiche pas la sortie d'un pré-build.
            {
              echo "PLATFORM_NAME=${PLATFORM_NAME:-} ARCHS=${ARCHS:-}"
              KMP_SWITCH_ONLY=1 KMP_MODULE=umbrella:settings-demo "$SRCROOT/../scripts/build-ios-framework.sh" "$config"
            } > "$SRCROOT/Generated/kotlin-prebuild.log" 2>&1
    platform: iOS
    sources: [Packages/FeatureSettings/Demo]
    settings:
      groups: [app]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mvp.ios.demo.settings
        INFOPLIST_KEY_CFBundleDisplayName: Settings Demo
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID protège l'accès à l'app si vous activez le déverrouillage dans Réglages."
    dependencies:
      - target: KotlinSettingsDemo
      - package: SharedKMP
        product: Shared
      - package: FeatureSettings

  # Démo de la feature connexion (écran de connexion, puis déconnexion).
  AuthDemo:
    type: application
    # Avant le build : son parapluie dans Packages/SharedKMP (voir iosApp).
    scheme:
      preActions:
        - name: Framework Kotlin de l'app
          settingsTarget: AuthDemo
          script: |
            if [ "$CONFIGURATION" = "Debug" ]; then config=debug; else config=release; fi
            # Journal : Xcode n'affiche pas la sortie d'un pré-build.
            {
              echo "PLATFORM_NAME=${PLATFORM_NAME:-} ARCHS=${ARCHS:-}"
              KMP_SWITCH_ONLY=1 KMP_MODULE=umbrella:auth-demo "$SRCROOT/../scripts/build-ios-framework.sh" "$config"
            } > "$SRCROOT/Generated/kotlin-prebuild.log" 2>&1
    platform: iOS
    sources: [Packages/FeatureAuth/Demo]
    settings:
      groups: [app]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mvp.ios.demo.auth
        INFOPLIST_KEY_CFBundleDisplayName: Auth Demo
    dependencies:
      - target: KotlinAuthDemo
      - package: SharedKMP
        product: Shared
      - package: FeatureAuth
      - package: DesignSystemUI

  # Démo de la feature catalogue (liste paginée, fiche produit, cache hors ligne).
  CatalogDemo:
    type: application
    # Avant le build : son parapluie dans Packages/SharedKMP (voir iosApp).
    scheme:
      preActions:
        - name: Framework Kotlin de l'app
          settingsTarget: CatalogDemo
          script: |
            if [ "$CONFIGURATION" = "Debug" ]; then config=debug; else config=release; fi
            # Journal : Xcode n'affiche pas la sortie d'un pré-build.
            {
              echo "PLATFORM_NAME=${PLATFORM_NAME:-} ARCHS=${ARCHS:-}"
              KMP_SWITCH_ONLY=1 KMP_MODULE=umbrella:catalog-demo "$SRCROOT/../scripts/build-ios-framework.sh" "$config"
            } > "$SRCROOT/Generated/kotlin-prebuild.log" 2>&1
    platform: iOS
    sources: [Packages/FeatureCatalog/Demo]
    settings:
      groups: [app]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mvp.ios.demo.catalog
        INFOPLIST_KEY_CFBundleDisplayName: Catalog Demo
    dependencies:
      - target: KotlinCatalogDemo
      - package: SharedKMP
        product: Shared
      - package: FeatureCatalog

  # Démo de l'écran Tâches en Compose Multiplatform, à comparer à TodoDemo (SwiftUI). ADR 0010.
  TodoComposeDemo:
    type: application
    # Avant le build : son parapluie dans Packages/SharedKMP (voir iosApp).
    scheme:
      preActions:
        - name: Framework Kotlin de l'app
          settingsTarget: TodoComposeDemo
          script: |
            if [ "$CONFIGURATION" = "Debug" ]; then config=debug; else config=release; fi
            # Journal : Xcode n'affiche pas la sortie d'un pré-build.
            {
              echo "PLATFORM_NAME=${PLATFORM_NAME:-} ARCHS=${ARCHS:-}"
              KMP_SWITCH_ONLY=1 KMP_MODULE=umbrella:todo-compose-demo "$SRCROOT/../scripts/build-ios-framework.sh" "$config"
            } > "$SRCROOT/Generated/kotlin-prebuild.log" 2>&1
    platform: iOS
    sources: [Packages/FeatureTodoCompose/Demo]
    info:
      path: Generated/TodoComposeDemo-Info.plist
      properties:
        # Exigé par Compose Multiplatform (voir iosApp ci-dessus).
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      groups: [app]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mvp.ios.demo.todocompose
        INFOPLIST_KEY_CFBundleDisplayName: Todo Compose Demo
    dependencies:
      - target: KotlinTodoComposeDemo
      - package: SharedKMP
        product: Shared
      - package: FeatureTodoCompose

  # Démo de la présentation du premier lancement (ADR 0016), remontrée à chaque ouverture.
  OnboardingDemo:
    type: application
    # Avant le build : son parapluie dans Packages/SharedKMP (voir iosApp).
    scheme:
      preActions:
        - name: Framework Kotlin de l'app
          settingsTarget: OnboardingDemo
          script: |
            if [ "$CONFIGURATION" = "Debug" ]; then config=debug; else config=release; fi
            # Journal : Xcode n'affiche pas la sortie d'un pré-build.
            {
              echo "PLATFORM_NAME=${PLATFORM_NAME:-} ARCHS=${ARCHS:-}"
              KMP_SWITCH_ONLY=1 KMP_MODULE=umbrella:onboarding-demo "$SRCROOT/../scripts/build-ios-framework.sh" "$config"
            } > "$SRCROOT/Generated/kotlin-prebuild.log" 2>&1
    platform: iOS
    sources: [Packages/FeatureOnboarding/Demo]
    info:
      path: Generated/OnboardingDemo-Info.plist
      properties:
        NSLocationDefaultAccuracyReduced: true
    settings:
      groups: [app]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mvp.ios.demo.onboarding
        INFOPLIST_KEY_CFBundleDisplayName: Onboarding Demo
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID protège l'accès à l'app si vous activez le déverrouillage."
        # Météo (ADR 0005) et rappels par lieu (ADR 0023) : « Lorsque l'app est active » suffit aux deux.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Météo : votre position approximative (environ 1 km) est envoyée à Open-Meteo pour afficher la météo là où vous êtes. La dernière est gardée sur cet iPhone pour le widget Météo : s'il est posé, elle repart pour l'actualiser quand vous ouvrez l'app. Elle est effacée à la déconnexion ou si vous retirez l'accès à la position. Rappels par lieu : la position exacte du lieu choisi reste sur cet iPhone et n'est envoyée nulle part."
    dependencies:
      - target: KotlinOnboardingDemo
      - package: SharedKMP
        product: Shared
      - package: FeatureOnboarding
      - package: DesignSystemUI
