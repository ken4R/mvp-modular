# Projet Xcode généré avec XcodeGen.
# Premier lancement : `scripts/build-ios-framework.sh && cd iosApp && xcodegen && open iosApp.xcodeproj`
#
# Chaque feature iOS est un package SPM dans Packages/ ; sa démo éventuelle (Packages/<Feature>/Demo)
# est une app déclarée ici, qui ne lance que cette feature.
name: iosApp
options:
  bundleIdPrefix: com.mvp
  deploymentTarget:
    iOS: "16.0"

packages:
  SharedKMP:
    path: Packages/SharedKMP
  DesignSystemUI:
    path: Packages/DesignSystemUI
  FeatureTodo:
    path: Packages/FeatureTodo
  FeatureWeather:
    path: Packages/FeatureWeather
  FeatureSettings:
    path: Packages/FeatureSettings
  FeatureAuth:
    path: Packages/FeatureAuth

settingGroups:
  app:
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES

aggregateTargets:
  # Recompile le XCFramework Kotlin avant chaque build des apps.
  KotlinShared:
    buildScripts:
      - name: Compile Kotlin (Shared.xcframework)
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/../scripts/build-ios-framework.sh" debug
    settings:
      ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  # App complète : assemble toutes les features.
  iosApp:
    type: application
    platform: iOS
    sources: [iosApp]
    settings:
      groups: [app]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mvp.ios
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Votre position approximative (environ 1 km) est envoyée au service météo Open-Meteo pour afficher la météo là où vous êtes. Elle n'est pas enregistrée."
        # Propose la position approximative par défaut dans la demande d'autorisation (équivalent d'ACCESS_COARSE_LOCATION).
        INFOPLIST_KEY_NSLocationDefaultAccuracyReduced: YES
    dependencies:
      - target: KotlinShared
      - package: SharedKMP
        product: Shared
      - package: FeatureTodo
      - package: FeatureWeather
      - package: FeatureSettings
      - package: FeatureAuth

  # Démo de la feature todo, lancée seule avec des données d'exemple.
  TodoDemo:
    type: application
    platform: iOS
    sources: [Packages/FeatureTodo/Demo]
    settings:
      groups: [app]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mvp.ios.demo.todo
        INFOPLIST_KEY_CFBundleDisplayName: Todo Demo
    dependencies:
      - target: KotlinShared
      - package: SharedKMP
        product: Shared
      - package: FeatureTodo

  # Démo de la feature météo, ouverte sur une recherche d'exemple.
  WeatherDemo:
    type: application
    platform: iOS
    sources: [Packages/FeatureWeather/Demo]
    settings:
      groups: [app]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mvp.ios.demo.weather
        INFOPLIST_KEY_CFBundleDisplayName: Weather Demo
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Votre position approximative (environ 1 km) est envoyée au service météo Open-Meteo pour afficher la météo là où vous êtes. Elle n'est pas enregistrée."
        # Propose la position approximative par défaut dans la demande d'autorisation (équivalent d'ACCESS_COARSE_LOCATION).
        INFOPLIST_KEY_NSLocationDefaultAccuracyReduced: YES
    dependencies:
      - target: KotlinShared
      - package: SharedKMP
        product: Shared
      - package: FeatureWeather

  # Démo de la feature réglages (profil, notifications, consentements).
  SettingsDemo:
    type: application
    platform: iOS
    sources: [Packages/FeatureSettings/Demo]
    settings:
      groups: [app]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mvp.ios.demo.settings
        INFOPLIST_KEY_CFBundleDisplayName: Settings Demo
    dependencies:
      - target: KotlinShared
      - package: SharedKMP
        product: Shared
      - package: FeatureSettings

  # Démo de la feature connexion (écran de connexion, puis déconnexion).
  AuthDemo:
    type: application
    platform: iOS
    sources: [Packages/FeatureAuth/Demo]
    settings:
      groups: [app]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mvp.ios.demo.auth
        INFOPLIST_KEY_CFBundleDisplayName: Auth Demo
    dependencies:
      - target: KotlinShared
      - package: SharedKMP
        product: Shared
      - package: FeatureAuth
      - package: DesignSystemUI
