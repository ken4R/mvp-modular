# Projet Xcode généré avec XcodeGen : `brew install xcodegen && cd iosApp && xcodegen`
name: iosApp
options:
  bundleIdPrefix: com.mvp
  deploymentTarget:
    iOS: "16.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources: [iosApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mvp.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared"]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Compile Kotlin (Shared.framework)
        basedOnDependencyAnalysis: false
        script: |
          # Xcode lancé depuis le Dock ne lit pas ~/.zshrc : on cherche le JDK nous-mêmes.
          if [ -z "${JAVA_HOME:-}" ]; then
            for candidate in \
              "$(/usr/libexec/java_home 2>/dev/null)" \
              /opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home \
              /opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home \
              /usr/local/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home; do
              if [ -n "$candidate" ] && [ -x "$candidate/bin/java" ]; then
                export JAVA_HOME="$candidate"
                break
              fi
            done
          fi
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "error: JDK 17+ introuvable. Installer avec 'brew install openjdk@21'."
            exit 1
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
